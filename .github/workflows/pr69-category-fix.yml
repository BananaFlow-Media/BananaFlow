name: PR69 category follow-up

on:
  push:
    branches:
      - codex/tag-editor-navigation

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: codex/tag-editor-navigation
          fetch-depth: 0

      - name: Move organization actions and add regression coverage
        shell: python
        run: |
          from pathlib import Path

          panel_path = Path("ui/panels/metadata_editor/panel.py")
          panel = panel_path.read_text(encoding="utf-8")
          old = '''        ("meta_section_text_cleanup", (
              "normalize_spaces", "strip_junk", "album_artist",
              "replace_text", "change_case", "number_tracks",
          )),
          ("meta_section_clear_fields", (
          '''
          new = '''        ("meta_section_text_cleanup", (
              "normalize_spaces", "strip_junk", "replace_text", "change_case",
          )),
          ("meta_action_category_organize", (
              "album_artist", "number_tracks",
          )),
          ("meta_section_clear_fields", (
          '''
          if panel.count(old) != 1:
              raise SystemExit("expected common-action section block exactly once")
          panel_path.write_text(panel.replace(old, new), encoding="utf-8")

          test_path = Path("tests/test_tag_editor_shell.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "\ndef test_action_engine_opens_on_a_named_action(panel, tmp_path):\n"
          addition = '''

def test_all_actions_separates_cleanup_from_tag_organization():
    sections = dict(MetadataEditorPanel._COMMON_ACTION_SECTIONS)

    assert sections["meta_section_text_cleanup"] == (
        "normalize_spaces", "strip_junk", "replace_text", "change_case",
    )
    assert sections["meta_action_category_organize"] == (
        "album_artist", "number_tracks",
    )

'''
          if marker not in tests:
              raise SystemExit("test insertion marker missing")
          if "test_all_actions_separates_cleanup_from_tag_organization" not in tests:
              test_path.write_text(tests.replace(marker, addition + marker, 1), encoding="utf-8")

          workflow = Path(".github/workflows/pr69-category-fix.yml")
          workflow.unlink()

      - name: Verify focused contract
        shell: python
        run: |
          import ast
          from pathlib import Path

          panel = Path("ui/panels/metadata_editor/panel.py").read_text(encoding="utf-8")
          tests = Path("tests/test_tag_editor_shell.py").read_text(encoding="utf-8")
          ast.parse(panel)
          ast.parse(tests)
          assert '"meta_action_category_organize"' in panel
          cleanup = panel.split('("meta_section_text_cleanup", (', 1)[1].split(')),', 1)[0]
          assert '"album_artist"' not in cleanup
          assert '"number_tracks"' not in cleanup

      - name: Commit focused correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ui/panels/metadata_editor/panel.py tests/test_tag_editor_shell.py
          git add -u -- .github/workflows/pr69-category-fix.yml
          git diff --cached --check
          git commit -m "fix: separate tag organization shortcuts"
          git push origin HEAD:codex/tag-editor-navigation
