name: Real-network tests

# Issue #34 asked for an integration test comparing the HTTP probe and the
# Playwright tab list against a real channel, because it "would have caught the
# stale-selector bug directly". The test was written, gated behind
# BANANAFLOW_RUN_NETWORK_TESTS=1, and then never ran — so it has caught nothing.
#
# Scheduled runs monitor third-party drift. Downloader-pin PRs also run the
# complete opt-in suite against the proposed dependency set, with read-only
# permissions. A challenged runner is a failure to investigate, not a pass.
# Normal-network maintainer acceptance remains required before release.

on:
  schedule:
    # Mondays 05:00 UTC, before the week's dependency updates land.
    - cron: "0 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - requirements.txt
      - pyproject.toml
      - .github/workflows/network-tests.yml
      - scripts/run_network_tests.py
      - tests/test_channel_tab_discoverer_phase6.py

permissions:
  contents: read

jobs:
  network-tests:
    name: Real-network tab discovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      network-outcome: ${{ steps.network.outcome }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run real-network tests
        id: network
        run: |
          # Kept on disk so the report step below can quote the failing
          # assertions. pipefail: without it tee's exit code would mask a
          # failing test run and this step would pass.
          set -o pipefail
          python scripts/run_network_tests.py 2>&1 | tee network-tests.log

      - name: Retain network test evidence
        if: always() && steps.network.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: network-test-evidence-${{ github.sha }}
          path: network-tests.log
          if-no-files-found: warn
          retention-days: 14

  report-scheduled-failure:
    # No PR code executes in a write-enabled job. Only the trusted scheduled
    # run may update the existing rolling diagnostic issue.
    if: always() && github.event_name == 'schedule' && needs.network-tests.outputs.network-outcome == 'failure'
    needs: network-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download this scheduled run's evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: network-test-evidence-${{ github.sha }}
      - name: Report a failure as an issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # One rolling issue, not one per week: reopen and comment on the
          # existing report rather than filing a duplicate every Monday.
          title="Real-network tab discovery is failing"
          existing=$(gh issue list --state all --search "$title in:title" \
            --json number,state --jq '.[0].number // empty')

          # Quote the failing assertions rather than only linking to them.
          # Issue #20 collected three reports that listed YouTube-side causes
          # only, and sent the investigation that way for weeks — while the
          # assertion in the log plainly read "Chromium is not installed",
          # a defect in this workflow's own environment.
          summary=""
          if [ -f network-tests.log ]; then
            summary=$(sed -n '/short test summary info/,$p' network-tests.log | head -40)
          fi
          [ -n "$summary" ] || summary="(no pytest summary captured — read the run log)"

          body=$(cat <<EOF
          The weekly real-network run failed: $RUN_URL

          \`\`\`
          $summary
          \`\`\`

          This checks BananaFlow's YouTube channel tab discovery against a real
          channel. A failure means one of:

          * this runner's own environment is broken — Chromium missing or
            invisible to Playwright, a dependency that will not install — which
            is a CI defect, not a product defect. The summary above names the
            failing assertion; read it before assuming anything about YouTube;
          * YouTube is blocking this GitHub Actions runner (CAPTCHA, IP
            reputation), which is common and is also NOT a product defect;
          * YouTube changed something (DOM, consent flow, yt-dlp extractor
            behaviour) and tab discovery is genuinely broken for users.

          Reproduce from a real network before concluding which:

          \`\`\`
          python scripts/run_network_tests.py
          \`\`\`
          EOF
          )

          if [ -n "$existing" ]; then
            gh issue reopen "$existing" || true
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label bug
          fi
