name: 📚 Documentation
description: README, CONTRIBUTING, in-app help text, or another doc is wrong, unclear, or missing.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Which document/page
      placeholder: e.g. README.md "Installation", or the in-app Settings tooltip for X
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong or missing
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix (if you have one)
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing Issues first
          required: true
