blank_issues_enabled: false
contact_links:
  - name: 🌐 BananaFlow official website
    url: https://bananaflow.bananaflow-media.workers.dev/
    about: >-
      Downloads, Help, FAQ and Support pages in English and Hebrew. Start
      here if you are using BananaFlow rather than developing it.
  - name: ❓ Help and FAQ (before opening an Issue)
    url: https://bananaflow.bananaflow-media.workers.dev/en/faq/
    about: >-
      The FAQ answers the most common install, download and format
      questions — including the Windows SmartScreen warning.
  - name: 🔒 Report a security vulnerability
    url: https://github.com/BananaFlow-Media/BananaFlow/security/advisories/new
    about: >-
      Do NOT open a public Issue for a security vulnerability. Use GitHub
      private vulnerability reporting instead. See SECURITY.md.
  - name: 💬 Usage question / "how do I...?"
    url: https://bananaflow.bananaflow-media.workers.dev/en/support/
    about: Use the official Support page after checking Help and FAQ.
  - name: 🏗️ Large or architecture-changing proposal
    url: https://github.com/BananaFlow-Media/BananaFlow/issues/new?template=feature_request.yml
    about: >-
      Open a focused proposal Issue and align on the approach before
      investing in a large PR. See CONTRIBUTING.md.
  - name: 🌐 Translation / RTL coordination
    url: https://github.com/BananaFlow-Media/BananaFlow/issues/new?template=hebrew_translation.yml
    about: >-
      Use the Hebrew/Translation form for terminology, wording, missing
      strings or RTL conventions across the UI.
